
name: Build HAPPY WORLD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android licenses and install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q HAPPY_WORLD_Android_Studio_Project.zip -d extracted
          test -f extracted/happy_world_android_project/app/build.gradle

      - name: Build HAPPY WORLD APK
        working-directory: extracted/happy_world_android_project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f extracted/happy_world_android_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAPPY-WORLD-APK
          path: extracted/happy_world_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          

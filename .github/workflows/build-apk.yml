
name: Build HAPPY WORLD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q HAPPY_WORLD_Android_Studio_Project.zip -d extracted

      - name: Build APK
        working-directory: extracted/happy_world_android_project
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HAPPY-WORLD-APK
          path: extracted/happy_world_android_project/app/build/outputs/apk/debug/*.apk
          
